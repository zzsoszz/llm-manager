[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-manager"
version = "0.1.0"
description = "A lightweight, configuration-driven CLI for local model servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "zzsoszz"}]
keywords = ["llm", "sglang", "llama.cpp", "monitoring", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/zzsoszz/llm-manager"
Issues = "https://github.com/zzsoszz/llm-manager/issues"

[project.scripts]
llm = "llm_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_manager = ["example.json"]
